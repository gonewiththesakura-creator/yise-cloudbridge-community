# Render with render-templates.mjs; do not install an unresolved template.
limit_req_zone $binary_remote_addr zone=cloudbridge_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cloudbridge_device:10m rate=60r/m;

server {
    listen {{HTTP_PORT}};
    listen [::]:{{HTTP_PORT}};
    server_name {{PUBLIC_HOST}};

    location ^~ /.well-known/acme-challenge/ {
        root {{ACME_WEBROOT}};
    }

    location / {
        return 301 https://{{CONSOLE_AUTHORITY}}$request_uri;
    }
}

server {
    listen {{CONSOLE_TLS_PORT}} ssl http2;
    listen [::]:{{CONSOLE_TLS_PORT}} ssl http2;
    server_name {{PUBLIC_HOST}};

    ssl_certificate {{DATA_PLANE_CERT_PATH}};
    ssl_certificate_key {{DATA_PLANE_KEY_PATH}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CloudBridgeTLS:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 128k;

    location ^~ /downloads/ {
        alias {{DOWNLOADS_DIR}}/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
        autoindex off;
    }

    location = /api/login {
        limit_req zone=cloudbridge_login burst=5 nodelay;
        proxy_pass http://{{CONSOLE_UPSTREAM}}:{{PORT}};
        proxy_set_header Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/device/ {
        limit_req zone=cloudbridge_device burst=20 nodelay;
        proxy_pass http://{{CONSOLE_UPSTREAM}}:{{PORT}};
        proxy_set_header Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://{{CONSOLE_UPSTREAM}}:{{PORT}};
        proxy_set_header Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host {{CONSOLE_AUTHORITY}};
        proxy_set_header X-Forwarded-Proto https;
    }
}
